name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure MSVC toolchain path
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tools="$(cygpath -u "$VCToolsInstallDir")/bin/Hostx64/x64"
          test -x "$tools/link.exe"
          test -x "$tools/lib.exe"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Install rake
        run: gem install rake --no-document

      - name: Build mruby 4.0.0
        run: ./scripts/build-mruby.sh

      - name: Verify pinned toolchain
        run: ./scripts/verify-toolchain.sh

      - name: Check binding symbols
        run: ./scripts/check-bindings.sh

      - name: Format check
        run: zig fmt --check build.zig src tests examples

      - name: Test (Debug)
        run: zig build test

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Build library and example
        run: zig build

      - name: Run example
        run: zig build run
