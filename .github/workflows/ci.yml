name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_arg: ""
          - os: macos-latest
            target_arg: ""
          - os: windows-latest
            target_arg: "-Dtarget=x86_64-windows-gnu"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw --no-progress -y

      - name: Configure MinGW
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CC=gcc" >> "$GITHUB_ENV"
          echo "AR=ar" >> "$GITHUB_ENV"
          echo "RANLIB=ranlib" >> "$GITHUB_ENV"

      - name: Install rake
        run: gem install rake --no-document

      - name: Build mruby 4.0.0
        run: ./scripts/build-mruby.sh

      - name: Verify pinned toolchain
        run: ./scripts/verify-toolchain.sh

      - name: Check binding symbols
        run: ./scripts/check-bindings.sh

      - name: Check generated bindings
        if: runner.os == 'macOS'
        run: ./scripts/generate-bindings.sh --check

      - name: Format check
        run: zig fmt --check build.zig src tests examples

      - name: Test (Debug)
        run: zig build test ${{ matrix.target_arg }}

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe ${{ matrix.target_arg }}

      - name: Build library and example
        run: zig build ${{ matrix.target_arg }}

      - name: Run example
        run: zig build run ${{ matrix.target_arg }}

  boxing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boxing: nan
            config: build_config/zruby-nan.rb
          - boxing: none
            config: build_config/zruby-none.rb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install rake
        run: gem install rake --no-document

      - name: Build mruby (${{ matrix.boxing }})
        run: MRUBY_CONFIG="$PWD/${{ matrix.config }}" ./scripts/build-mruby.sh

      - name: Check binding symbols
        run: ./scripts/check-bindings.sh

      - name: Format check
        run: zig fmt --check build.zig src tests examples

      - name: Test (Debug)
        run: zig build test -Dmruby-boxing=${{ matrix.boxing }}

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe -Dmruby-boxing=${{ matrix.boxing }}

      - name: Build library and example
        run: zig build -Dmruby-boxing=${{ matrix.boxing }}

      - name: Run example
        run: zig build run -Dmruby-boxing=${{ matrix.boxing }}

  nobigint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install rake
        run: gem install rake --no-document

      - name: Build mruby without BigInt
        run: MRUBY_CONFIG="$PWD/build_config/zruby-nobigint.rb" ./scripts/build-mruby.sh

      - name: Test non-BigInt hash behavior
        run: zig build test-nonbigint -Dmruby-bigint=false
