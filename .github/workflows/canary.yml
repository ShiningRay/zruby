name: Canary

on:
  schedule:
    # Weekly probe against Zig master. Failures are signal, not release gates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  zig-master:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: master

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install rake
        run: gem install rake --no-document

      - name: Build pinned mruby
        run: ./scripts/build-mruby.sh

      - name: Probe current Zig with the pinned mruby
        run: zig build test -Dallow-untested-zig
